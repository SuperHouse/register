{% load static %}
{% if brand_favicon_url %}
    {# A BrandedHost's own favicon: one 192px PNG, under a new name each time it is replaced. #}
    <link rel="icon" type="image/png" sizes="192x192" href="{{ brand_favicon_url }}">
    <link rel="apple-touch-icon" href="{{ brand_favicon_url }}">
{% else %}
    {# The Testomatic default. Bump ?v= whenever these files change: browsers cache favicons very stubbornly. #}
    <link rel="icon" href="{% static 'favicon.ico' %}?v=2" sizes="48x48">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'img/favicon-192.png' %}?v=2">
    <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}?v=2">
{% endif %}
